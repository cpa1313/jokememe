name: 🎬 Render Mika Nurse video to GitHub assets

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install Pillow
      - name: Prepare output folders
        run: mkdir -p output assets/MikaNurse
      - name: Generate Mika Nurse video
        run: python mikanurse_video_generator.py
      - name: Commit rendered video and progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/MikaNurse benefits_progress.json
          git diff --staged --quiet || git commit -m "chore: add MikaNurse video [skip ci]"
          git pull --rebase
          git push
