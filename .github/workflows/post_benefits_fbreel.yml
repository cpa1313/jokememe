name: 🎬 Benefits Reel Poster

on:
  schedule:
    # Spread across the day instead of one fixed daily slot.
    # Each trigger time below is a *window start* — the job adds random
    # jitter on top so the actual post time isn't identical every day.
    - cron: "15 1 * * *"   # ~09:15 PHT window
    - cron: "40 5 * * *"   # ~13:40 PHT window
    - cron: "5 10 * * *"   # ~18:05 PHT window
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install requests Pillow
      - name: Prepare output folder
        run: mkdir -p output
      - name: Random jitter before posting
        run: |
          # Sleep a random 0-40 minutes so the post lands at a
          # human-looking, non-identical time each run.
          SLEEP_SECONDS=$(( RANDOM % 2400 ))
          echo "Sleeping ${SLEEP_SECONDS}s before posting"
          sleep "$SLEEP_SECONDS"
      - name: Generate and post benefits reel
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python viralvideo_benefits_maker.py
      - name: Upload rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benefits-reel-${{ github.run_number }}
          path: output/reel.mp4
          retention-days: 7
      - name: Save posting progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benefits_progress.json
          git diff --staged --quiet || git commit -m "chore: update benefits progress [skip ci]"
          git pull --rebase
          git push
